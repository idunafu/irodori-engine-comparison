[project]
name = "irodori-comparison-onnx-export"
version = "0.1.0"
requires-python = "==3.10.*"
dependencies = [
    "irodori-tts[cu128]",
    "torch==2.10.0+cu128",
    "torchaudio==2.10.0+cu128",
    "onnx==1.20.1",
    "onnxruntime-gpu==1.23.2",
    "onnxscript==0.5.7",
    "soundfile>=0.12.0",
]

[tool.uv]
override-dependencies = ["protobuf>=4.25.1"]

[tool.uv.sources]
irodori-tts = { path = "../../engines/Irodori-TTS", editable = true }
dacvae = { git = "https://github.com/facebookresearch/dacvae", rev = "414c20785fc3a28373073ea8ef7a1316eeeaca6e" }
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
